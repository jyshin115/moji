<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신청 가능 판정·마감 알림 — 프로토타입 (heejin)</title>
<style>
  body { font-family: "맑은 고딕", sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
  label { display: block; margin: .5rem 0; } select, input { padding: .5rem; font-size: 1rem; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: .8rem 0; }
  .tag { display: inline-block; padding: .1rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: bold; }
  .ok { background: #dcf5dc; } .need { background: #fff3cd; } .no { background: #fde2e2; }
  .muted { color: #666; font-size: .9rem; }
  .evidence { font-size: .9rem; margin: .3rem 0 0 1rem; }
</style>
</head>
<body>
<h1>신청 가능 판정·마감 알림 — 프로토타입</h1>
<p class="muted">스펙: docs/specs/heejin-eligibility.md (P0 범위).
아래 공고 5건은 전부 샘플이다. 실제 공고가 아니다.
판정은 규칙이 먼저 하고, 불확실한 조건은 "확인 필요"로 표시하며 확정 안내로 바꾸지 않는다.</p>

<h2>1. 사업장 정보 입력</h2>
<label>업종
  <select id="biz">
    <option value="음식점">음식점</option>
    <option value="제조">제조</option>
    <option value="도소매">도소매</option>
    <option value="서비스업">서비스업</option>
  </select>
</label>
<label>지역
  <select id="region">
    <option value="서울">서울</option>
    <option value="경기">경기</option>
    <option value="부산">부산</option>
    <option value="기타">기타</option>
  </select>
</label>
<label>업력 (개월) <input id="months" type="number" value="18" min="0"></label>
<label>연매출 (억 원) <input id="sales" type="number" value="2" min="0" step="0.1"></label>
<label>상시근로자 수 (명) <input id="workers" type="number" value="3" min="0"></label>
<br><button onclick="judge()">판정하기</button>

<h2>2. 판정 결과</h2>
<div id="results"><p class="muted">사업장 정보를 입력하고 "판정하기"를 누르세요.</p></div>

<h2>3. 마감 알림 큐</h2>
<div id="alerts"><p class="muted">판정 후 마감 7일 이내인 신청 가능 공고가 여기에 뜹니다.</p></div>

<script>
  // 샘플 공고 5건 (실제 공고 아님). 조건: 업종/지역/업력/매출/근로자 수.
  // uncertain: true인 조건은 본문과 각주가 달라 보이는 경우로, "확인 필요"를 만든다.
  const notices = [
    { name: "샘플: 영세 소상공인 경영개선 지원", industry: "무관", region: "전국",
      months: 12, sales: 5, workers: 5, deadline: "2026-11-15",
      quotes: { industry: "업종 무관", region: "전국 사업장", months: "업력 1년 이상", sales: "연매출 5억 이하", workers: "상시근로자 5인 미만" } },
    { name: "샘플: 서울 골목상권 활성화 지원", industry: "음식점,도소매", region: "서울",
      months: 6, sales: 3, workers: 5, deadline: "2026-11-05",
      quotes: { industry: "음식점·도소매", region: "서울 소재", months: "업력 6개월 이상", sales: "연매출 3억 이하", workers: "상시근로자 5인 미만" } },
    { name: "샘플: 제조 소공인 설비 지원", industry: "제조", region: "전국",
      months: 24, sales: 10, workers: 5, deadline: "2026-12-01", uncertainMonths: true,
      quotes: { industry: "제조업", region: "전국 사업장", months: "업력 조건이 본문과 각주에서 다르게 적혀 있음", sales: "연매출 10억 이하", workers: "상시근로자 5인 미만" } },
    { name: "샘플: 부산 소상공인 판로 지원", industry: "무관", region: "부산",
      months: 6, sales: 5, workers: 5, deadline: "2026-11-30",
      quotes: { industry: "업종 무관", region: "부산 소재", months: "업력 6개월 이상", sales: "연매출 5억 이하", workers: "상시근로자 5인 미만" } },
    { name: "샘플: 폐업 예정 사업자 재기 지원 (마감 지남)", industry: "무관", region: "전국",
      months: 0, sales: 999, workers: 5, deadline: "2026-10-20",
      quotes: { industry: "업종 무관", region: "전국 사업장", months: "업력 무관", sales: "매출 무관", workers: "상시근로자 5인 미만" } },
  ];

  function dday(deadline) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((new Date(deadline) - today) / 86400000);
  }
  function judge() {
    const biz = document.getElementById("biz").value;
    const region = document.getElementById("region").value;
    const months = +document.getElementById("months").value;
    const sales = +document.getElementById("sales").value;
    const workers = +document.getElementById("workers").value;
    let html = "", alerts = [];
    for (const n of notices) {
      const checks = [];
      checks.push(["업종", n.industry === "무관" || n.industry.split(",").includes(biz), n.quotes.industry]);
      checks.push(["지역", n.region === "전국" || n.region === region, n.quotes.region]);
      if (n.uncertainMonths) checks.push(["업력", "?", n.quotes.months]);
      else checks.push(["업력", months >= n.months, n.quotes.months]);
      checks.push(["매출", sales <= n.sales, n.quotes.sales]);
      checks.push(["상시근로자", workers < 5, n.quotes.workers]); // 5인 미만 기준
      const dd = dday(n.deadline);
      let status, cls;
      if (dd < 0) { status = "해당 없음 (마감 지남)"; cls = "no"; }
      else if (checks.some(c => c[1] === false)) { status = "해당 없음"; cls = "no"; }
      else if (checks.some(c => c[1] === "?")) { status = "확인 필요"; cls = "need"; }
      else { status = "신청 가능"; cls = "ok"; }
      if (status === "신청 가능" && dd <= 7) alerts.push(`${n.name} — 마감 D-${dd} (${n.deadline})`);
      html += `<div class="card"><span class="tag ${cls}">${status}</span> <b>${n.name}</b>
        <span class="muted">마감 ${n.deadline} (D-${dd >= 0 ? dd : "지남"})</span>
        ${checks.map(c => `<div class="evidence">${c[1] === true ? "✓" : c[1] === "?" ? "?" : "✗"} ${c[0]}: ${c[2]}</div>`).join("")}
        ${status === "확인 필요" ? `<div class="evidence"><b>되묻는 질문:</b> 업력 조건이 본문과 각주에서 다르게 적혀 있습니다. 사업자등록증상 개업일이 언제인가요?</div>` : ""}
      </div>`;
    }
    document.getElementById("results").innerHTML = html;
    document.getElementById("alerts").innerHTML = alerts.length
      ? alerts.map(a => `<div class="card"><span class="tag need">마감 임박</span> ${a}</div>`).join("")
      : `<p class="muted">마감 7일 이내인 신청 가능 공고가 없습니다.</p>`;
  }
</script>
</body>
</html>
